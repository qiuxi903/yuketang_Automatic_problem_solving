[pay]
; 后端地址：本机部署用 28080；域名部署填 https://你的域名
backend_url = http://localhost:28080
; 监听令牌：管理后台 → VIP 运营 → 支付与活动 → 「监听令牌」复制到这里
listen_token = PASTE-YOUR-LISTEN-TOKEN
; 策略：auto（推荐，UIA 失败自动切 OCR）/ uia / ocr / wcf（有封号风险）
strategy = auto
; 轮询间隔（秒）。wcf 策略下此值无效（钩子本身是阻塞推送）
poll_interval = 1.5

[windows]
; 要盯的窗口标题关键词（微信电脑版主窗口标题含「微信」）
keywords = 微信,支付宝
; 会话列表里要盯的会话名（收款通知的发送方）
session_keywords = 微信支付,收款助手,收款小账本
