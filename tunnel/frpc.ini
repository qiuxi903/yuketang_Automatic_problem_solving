# ============================================================================
# 雨课堂做题台 · 内网穿透客户端配置（frp = frpc，保存为 frpc.ini）
#
# 只暴露前端 25173：/api 与 /ws 都由前端 Vite 代理到后端（28080），
# 后端/matcher/collector 一律不要直接暴露到公网。
#
# 用法：
#   Windows:  frpc.exe -c frpc.ini
#   新版 frp（≥ v0.52）默认用 TOML，如提示格式不支持，可用 frpc -c frpc.ini
#   指定本文件，或按文末注释改成 frpc.toml
#
# 端口核对：local_port 必须与启动器 Frontend 卡片显示的端口一致。
# 默认 25173；若该端口被占用/被系统保留，启动器会自动换到 25174~25192，
# 此时把下面的 local_port 同步改掉即可（状态栏「做题台 http://localhost:xxxx」）。
# ============================================================================

[common]
# ① 有公网 IP 的服务器地址（运行 frps 的那台机器）
server_addr = 1.2.3.4
# ② frps 的 bind_port（与服务端 frps.ini 保持一致）
server_port = 7000
# ③ 鉴权令牌：务必改成自己的长随机串，并与 frps.ini 完全一致
token = change-me-to-a-long-random-token

# 日志（可选）
log_file = frpc.log
log_level = info
log_max_days = 3


# ----------------------------------------------------------------------------
# 方案 A：TCP 直连（最省事）
# 访问方式：http://服务器IP:25173
# 注意：HTTP 下浏览器剪贴板 API 不可用（「复制邀请链接」会提示手动复制），
#       想完整体验请用方案 B 的 HTTPS 域名。
# ----------------------------------------------------------------------------
[ykt-web-tcp]
type = tcp
local_ip = 127.0.0.1
local_port = 25173
remote_port = 25173        # 服务器防火墙/安全组需放行 25173


# ----------------------------------------------------------------------------
# 方案 B：HTTP 域名（推荐，可配合 Nginx 上 HTTPS）
# 前提：域名解析到 frps 服务器；frps.ini 配了 vhost_http_port = 80
# 访问方式：http://ykt.example.com（由服务器上的 Nginx 终止 TLS 后再反代到 80）
#
# WebSocket（/ws 实时进度）无需额外配置：走同一个域名，frp 自动透传升级请求。
# ----------------------------------------------------------------------------
# [ykt-web-http]
# type = http
# local_ip = 127.0.0.1
# local_port = 25173
# custom_domains = ykt.example.com


# ----------------------------------------------------------------------------
# 新版 frp（≥ v0.52）改用 TOML 时，等价配置如下（另存为 frpc.toml）：
#
# serverAddr = "1.2.3.4"
# serverPort = 7000
# auth.method = "token"
# auth.token = "change-me-to-a-long-random-token"
# log.to = "frpc.log"
#
# [[proxies]]
# name = "ykt-web-tcp"
# type = "tcp"
# localIP = "127.0.0.1"
# localPort = 25173
# remotePort = 25173
#
# [[proxies]]
# name = "ykt-web-http"
# type = "http"
# localIP = "127.0.0.1"
# localPort = 25173
# customDomains = ["ykt.example.com"]
# ----------------------------------------------------------------------------
