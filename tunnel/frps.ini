# ============================================================================
# 雨课堂做题台 · 内网穿透服务端配置（frp = frps，保存为 frps.ini）
#
# 放在有公网 IP 的服务器上运行：frps -c frps.ini
# 安全组/防火墙需放行：7000（frp 控制）、80（HTTP 域名，可选）
# ============================================================================

[common]
# 与客户端 frpc.ini 的 server_port 一致
bind_port = 7000
# 与客户端 frpc.ini 的 token 一致（务必换成自己的长随机串）
token = change-me-to-a-long-random-token

# HTTP 域名方式（对应客户端 [ykt-web-http]）
vhost_http_port = 80

# 管理面板（可选）：浏览器访问 http://服务器IP:7500，用下面的账号登录
dashboard_port = 7500
dashboard_user = admin
dashboard_pwd = change-me-to-a-long-random-password

# 日志
log_file = frps.log
log_level = info
log_max_days = 7
