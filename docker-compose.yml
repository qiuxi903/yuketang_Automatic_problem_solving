# 雨课堂自动化做题平台 · 编排（P1 起用 Docker；P0 可直接用 start-dev.ps1 本地跑）
# 说明：P0 的 backend 默认用 H2 内存库，无需 mysql/redis；下面两者为 P1 持久化预留。

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ykt_root
      MYSQL_DATABASE: ykt
      MYSQL_USER: ykt
      MYSQL_PASSWORD: ykt_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  matcher:
    build: ./matcher
    ports:
      - "28100:8100"
    environment:
      ANSWER_LIB_DIR: /app/answer-lib
    volumes:
      - ./answer-lib:/app/answer-lib

  collector:
    build: ./collector
    ports:
      - "28200:8200"
    environment:
      ANSWER_LIB_DIR: /app/answer-lib
    volumes:
      - ./answer-lib:/app/answer-lib

  backend:
    build: ./backend
    ports:
      - "28080:28080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ykt?useUnicode=true&characterEncoding=utf8mb4
      SPRING_DATASOURCE_USERNAME: ykt
      SPRING_DATASOURCE_PASSWORD: ykt_pass
      SPRING_DATA_REDIS_HOST: redis
      ANSWER_LIB_DIR: /app/answer-lib
    volumes:
      - ./answer-lib:/app/answer-lib
    depends_on:
      - mysql
      - redis

  agent:
    build: ./agent
    environment:
      BACKEND_BASE: http://backend:28080
      MATCHER_BASE: http://matcher:8100
      COLLECTOR_BASE: http://collector:8200
      AGENT_COURSE: ""
      AGENT_WORKER_COUNT: "1"
    depends_on:
      - backend
      - matcher
      - collector

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
